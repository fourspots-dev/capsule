<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>tinyai workspace preview</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: 36px minmax(0, 1fr); background: #f5f6f8; color: #191b1f; }
    header { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #d9dde2; background: #fff; }
    #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
    #output, iframe, img { width: 100%; height: 100%; margin: 0; border: 0; }
    #output { overflow: auto; white-space: pre-wrap; padding: 0; }
    img { object-fit: contain; }
  </style>
</head>
<body>
  <header><strong>tinyai</strong><span id="status">Loading workspace resource…</span></header>
  <main id="output"></main>
  <script src="js/workspace-preview/main.js"></script>
</body>
</html>
