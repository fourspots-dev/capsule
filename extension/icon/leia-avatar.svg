<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 聊天里的助手头像：与扩展图标同一套视觉（蓝渐变 + 白色四角火花），但做成**圆形**。
       实际渲染尺寸有三个：16px（"正在工作"指示）、64px（空态）、登录墙 brandmark ——
       所以只留一个大而简单的形状，不放任何小细节（16px 下细节会糊）。 -->
  <defs>
    <linearGradient id="leia-avatar-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FB0FF"/>
      <stop offset="0.55" stop-color="#1A88FF"/>
      <stop offset="1" stop-color="#0B5FE0"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#leia-avatar-tile)"/>
  <!-- 四角火花：外接半径 13/48 ≈ 27%（16px 渲染时最外点约 8.7px，仍清晰） -->
  <path
    d="M24 11c1.5 8 5.6 11.5 13 13-7.4 1.5-11.5 5-13 13-1.5-8-5.6-11.5-13-13 7.4-1.5 11.5-5 13-13Z"
    fill="#FFFFFF"/>
</svg>
